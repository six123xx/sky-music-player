<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>跟弹悬浮窗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html {
    /* 谱面缩放比例(默认 100%),可在「谱面」调整模式下用滚轮自由调节 */
    --scroll-scale: 1;
  }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #eef4ff;
    cursor: default;
  }
  #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

  /* ---------- 顶部工具条(两行:操作按钮 + 参数调节;实心不透明,始终可点击) ---------- */
  .toolbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 3px 5px;
    background: #0d1526;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px 10px 0 0;
    -webkit-app-region: drag;
    z-index: 20;
  }
  .tb-row { display: flex; align-items: center; gap: 4px; height: 22px; }
  .tb-row.sub { height: 19px; }
  .toolbar .grip { width: 10px; height: 10px; opacity: 0.45; flex: none; }
  .toolbar .grip svg { display: block; }
  .song-name {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.92;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .status { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,0.08); color: #9fb4d8; flex: none; }
  .tb-row.sub .status { margin-left: auto; }
  .status.on { background: rgba(80, 210, 140, 0.22); color: #7fe8b0; }
  .stats { font-size: 10px; color: #a8bcdd; flex: none; white-space: nowrap; }
  .stats .ok { color: #6fe39b; }
  .stats .no { color: #ff8d8d; }
  .btn {
    -webkit-app-region: no-drag;
    outline: none;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    color: #eaf2ff;
    background: rgba(90, 160, 255, 0.25);
    border: 1px solid rgba(120, 180, 255, 0.35);
    border-radius: 6px;
    padding: 2px 8px;
    flex: none;
    transition: background 0.15s;
  }
  .btn:hover { background: rgba(90, 160, 255, 0.45); }
  .btn.stop { background: rgba(255, 110, 110, 0.3); border-color: rgba(255, 130, 130, 0.4); }
  .btn.stop:hover { background: rgba(255, 110, 110, 0.5); }
  .btn.adjust { background: rgba(255, 200, 90, 0.25); border-color: rgba(255, 210, 120, 0.4); }
  .btn.adjust.active { background: rgba(255, 200, 90, 0.55); border-color: #ffd97a; color: #fff; }
  .btn.close { background: transparent; border: none; padding: 2px 5px; font-size: 14px; color: #93a6c8; line-height: 1; }
  .btn.close:hover { color: #fff; background: rgba(255,90,90,0.35); }
  .btn.mini { width: 17px; height: 16px; padding: 0; font-size: 12px; line-height: 1; border-radius: 5px; }
  .grp { flex: none; font-size: 10px; color: #9fb4d8; }
  .grp-val { flex: none; min-width: 36px; text-align: center; font-size: 10px; color: #cfe0ff; font-variant-numeric: tabular-nums; }
  /* 倒计时时长输入框 */
  .cd-input {
    flex: none;
    width: 32px;
    padding: 1px 3px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 4px;
    color: #cfe0ff;
    font-size: 11px;
    text-align: center;
    outline: none;
    -webkit-app-region: no-drag;
  }
  .cd-input:focus { border-color: rgba(90, 160, 255, 0.7); }

  /* ---------- 进度条 ---------- */
  .progress { position: absolute; top: 49px; left: 0; right: 0; height: 3px; z-index: 10; background: rgba(255,255,255,0.05); }
  .progress .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4db4ff, #7fe8b0); border-radius: 2px; transition: width 0.15s; }

  /* ---------- 琴键区(3 行 5 列,占满窗口,可拖动微调对齐游戏按键) ---------- */
  .keys {
    position: absolute;
    top: 52px; left: 0; right: 0;
    width: min(480px, 92%);
    margin: 0 auto;
    bottom: calc((66px * var(--scroll-scale, 1)) * var(--scroll-rows, 1)
                 + (14px * var(--scroll-scale, 1)) * (var(--scroll-rows, 1) - 1) + 10px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    background: rgba(12, 18, 32, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    z-index: 5;
    will-change: transform;
  }
  body.adjust .keys {
    outline: 2px dashed rgba(255, 210, 120, 0.65);
    outline-offset: -2px;
    cursor: move;
    background: rgba(12, 18, 32, 0.85);
  }
  .key-row { display: flex; gap: 8px; flex: 1; }
  /* 截图对齐模式:琴键按绝对坐标精确定位(覆盖游戏按键)
     必须让 .keys 的定位原点与窗口原点重合,否则 key 的 left/top 会整体偏移 */
  .keys.aligned {
    display: block;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; margin: 0;
    gap: 0; padding: 0;
    background: transparent;
    border-color: transparent;
  }
  .keys.aligned .key {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 700;
  }
  body.adjust .keys.aligned { background: rgba(12, 18, 32, 0.45); }
  .key {
    position: relative;
    flex: 1;
    border-radius: 6px;
    border: 2px solid rgba(255, 255, 255, 0.18);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.05));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  /* 预备高亮:即将要弹的键(提前 leadMs 亮起,呼吸提示) */
  .key.pending { animation: keyPulse 0.45s ease-in-out infinite alternate; }
  @keyframes keyPulse {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }
  /* 下一个要弹的键(所有待弹键中时间最近的,和弦则整组):最醒目提示 */
  .key.next {
    animation: nextPulse 0.35s ease-in-out infinite alternate;
    border-width: 3px;
    z-index: 2;
  }
  @keyframes nextPulse {
    from { transform: scale(1.06); filter: brightness(1.15); }
    to { transform: scale(1.14); filter: brightness(1.5); }
  }
  /* 下一个键的剩余时间倒计时角标 */
  .key .next-badge {
    position: absolute;
    top: -7px; right: -7px;
    min-width: 20px; height: 16px;
    padding: 0 5px;
    border-radius: 9px;
    background: #ffffff;
    color: #0d1526;
    font-size: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    pointer-events: none;
    z-index: 3;
  }
  /* 相邻单音颜色不同,同时间和弦同色 */
  .key.pending-0 { background: linear-gradient(180deg, rgba(0, 229, 255, 0.85), rgba(0, 160, 255, 0.6)); border-color: #5af0ff; box-shadow: 0 0 16px rgba(0, 229, 255, 0.85); color: #fff; }
  .key.pending-1 { background: linear-gradient(180deg, rgba(192, 132, 252, 0.85), rgba(140, 80, 220, 0.6)); border-color: #d8b4fe; box-shadow: 0 0 16px rgba(192, 132, 252, 0.85); color: #fff; }
  .key.pending-2 { background: linear-gradient(180deg, rgba(255, 159, 67, 0.85), rgba(255, 120, 30, 0.6)); border-color: #ffd194; box-shadow: 0 0 16px rgba(255, 159, 67, 0.85); color: #fff; }
  .key.pending-3 { background: linear-gradient(180deg, rgba(255, 107, 157, 0.85), rgba(255, 60, 120, 0.6)); border-color: #ffb6d5; box-shadow: 0 0 16px rgba(255, 107, 157, 0.85); color: #fff; }
  .key.pending-4 { background: linear-gradient(180deg, rgba(123, 237, 159, 0.85), rgba(60, 200, 110, 0.6)); border-color: #b0ffd0; box-shadow: 0 0 16px rgba(123, 237, 159, 0.85); color: #142b1e; }
  .key.pending-5 { background: linear-gradient(180deg, rgba(255, 234, 167, 0.85), rgba(255, 210, 100, 0.6)); border-color: #fff4c2; box-shadow: 0 0 16px rgba(255, 234, 167, 0.85); color: #3d3418; }
  /* 按中:绿闪 */
  .key.hit {
    background: linear-gradient(180deg, rgba(80, 220, 130, 0.85), rgba(40, 160, 90, 0.6));
    border-color: rgba(110, 240, 160, 0.95);
    box-shadow: 0 0 14px rgba(90, 220, 140, 0.8);
    color: #eafff2;
  }
  /* 按错:红闪 */
  .key.wrong {
    background: linear-gradient(180deg, rgba(255, 90, 90, 0.85), rgba(200, 50, 50, 0.6));
    border-color: rgba(255, 130, 130, 0.95);
    box-shadow: 0 0 14px rgba(255, 90, 90, 0.8);
    color: #ffe9e9;
  }
  /* 漏按:暗灰 */
  .key.miss {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
    border-color: rgba(255, 255, 255, 0.3);
    color: rgba(255, 255, 255, 0.4);
  }

  /* ---------- 调整模式 ---------- */
  body.adjust #app { outline: 2px dashed rgba(255, 210, 120, 0.9); outline-offset: -2px; }
  .adjust-hint {
    display: none;
    position: absolute;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    font-size: 11px;
    color: #ffe9b0;
    background: rgba(40, 30, 10, 0.9);
    border: 1px solid rgba(255, 210, 120, 0.5);
    border-radius: 8px;
    padding: 4px 12px;
    z-index: 30;
    pointer-events: none;
    white-space: nowrap;
  }
  body.adjust .adjust-hint { display: block; }

  /* ---------- 换曲按钮 ---------- */
  .btn.song { background: rgba(140, 110, 255, 0.3); border-color: rgba(170, 140, 255, 0.45); }
  .btn.song:hover { background: rgba(140, 110, 255, 0.5); }
  .btn.song.active { background: rgba(140, 110, 255, 0.65); }

  /* ---------- 换曲面板(悬浮窗内弹出歌曲列表) ---------- */
  .song-panel {
    display: none;
    position: absolute;
    top: 52px; left: 8px; right: 8px;
    max-height: 264px;
    background: rgba(14, 20, 36, 0.97);
    border: 1px solid rgba(120, 180, 255, 0.4);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    z-index: 50;
    flex-direction: column;
    overflow: hidden;
  }
  .song-panel.show { display: flex; }
  .song-panel .sp-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .song-panel .sp-title { flex: none; font-size: 11px; color: #cfe0ff; font-weight: 600; }
  .song-panel .sp-close {
    flex: none;
    border: none;
    background: none;
    cursor: pointer;
    color: #93a6c8;
    font-size: 13px;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 4px;
    -webkit-app-region: no-drag;
  }
  .song-panel .sp-close:hover { color: #fff; background: rgba(255, 90, 90, 0.35); }
  .song-list { overflow-y: auto; max-height: 220px; }
  .song-list::-webkit-scrollbar { width: 6px; }
  .song-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
  .song-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 11px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    -webkit-app-region: no-drag;
  }
  .song-item:hover { background: rgba(90, 160, 255, 0.18); }
  .song-item.err { color: #ff8d8d; }
  .song-tag {
    flex: none;
    font-size: 9px;
    padding: 0 4px;
    border-radius: 4px;
    background: rgba(140, 110, 255, 0.25);
    color: #cdb8ff;
  }
  .song-tag.cloud { background: rgba(90, 200, 255, 0.22); color: #9fd8ff; }
  .song-name2 {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #e8efff;
    font-weight: 600;
  }
  .song-author {
    flex: none;
    max-width: 90px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #8fa3c8;
    font-size: 10px;
  }
  .song-loading { padding: 12px; text-align: center; font-size: 11px; color: #9fb4d8; }

  /* ---------- 换曲面板:搜索 / 刷新 / 当前歌曲高亮 ---------- */
  .sp-search {
    flex: 1;
    min-width: 0;
    font-size: 10px;
    font-family: inherit;
    color: #e8efff;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 5px;
    padding: 2px 6px;
    outline: none;
    -webkit-app-region: no-drag;
    user-select: text;
  }
  .sp-search::placeholder { color: #6f83a8; }
  .sp-refresh:hover { color: #fff; background: rgba(90, 160, 255, 0.4); }
  .song-item.current { background: rgba(110, 240, 160, 0.14); }
  .song-item.current .song-tag { background: rgba(110, 240, 160, 0.28); color: #a5ffc9; }

  /* ---------- 底部滚动谱面(3×5 网格块,每排 5 块,垂直滚动) ---------- */
  .scroller {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: calc((66px * var(--scroll-scale, 1)) * var(--scroll-rows, 1)
                 + (14px * var(--scroll-scale, 1)) * (var(--scroll-rows, 1) - 1) + 10px);
    background: rgba(12, 18, 32, 0.92);
    border: none;
    z-index: 5;
    overflow: hidden;
  }
  /* 谱面位置调整模式 */
  body.scroll-adjust .scroller {
    border: 2px dashed rgba(255, 214, 79, 0.75);
    cursor: move;
    background: rgba(20, 26, 44, 0.95);
  }
  .sc-notes {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(5, calc(110px * var(--scroll-scale, 1)));
    grid-auto-rows: calc(66px * var(--scroll-scale, 1));
    align-content: start;
    justify-content: center;
    gap: calc(14px * var(--scroll-scale, 1));
    padding: 4px 10px;
    transition: transform 0.18s ease-out;
    will-change: transform;
  }
  /* 无乐谱时的空白骨架:自动缓慢滚动,保证空白谱面也有滚动效果 */
  .sc-notes.preview {
    transition: none;
    animation: scPreviewScroll 1.6s linear infinite;
  }
  @keyframes scPreviewScroll {
    from { transform: translateY(0); }
    to { transform: translateY(calc(-1 * ((66px * var(--scroll-scale, 1)) + (14px * var(--scroll-scale, 1))))); }
  }
  /* 固定 110×66(5:3),内部 padding/gap 按 1:2 配比,15 个按键格恒为正方形;无外框边界 */
  .sc-block {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: calc(6px * var(--scroll-scale, 1));
    width: calc(110px * var(--scroll-scale, 1));
    height: calc(66px * var(--scroll-scale, 1));
    padding: calc(3px * var(--scroll-scale, 1));
    background: transparent;
    border: none;
    transition: background 0.12s ease, box-shadow 0.12s ease;
  }
  /* 当前块(判定位):不用外框,靠整排格子提亮表示 */
  .sc-block.current-block {
    background: transparent;
    box-shadow: none;
  }
  .sc-block.current-block .sc-cell {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.16);
  }
  /* 倒计时期间的空白预滚块:极淡占位,不显示音符,无虚线边界 */
  .sc-block.blank {
    background: transparent;
    border: none;
    box-shadow: none;
  }
  /* 空白块滚到判定位时同样给出淡高亮,滚动效果连贯不断档 */
  .sc-block.blank.current-block {
    background: transparent;
    box-shadow: none;
  }
  .sc-block.blank.current-block .sc-cell {
    background: rgba(255, 255, 255, 0.055);
  }
  .sc-block.blank .sc-cell {
    background: rgba(255, 255, 255, 0.02);
    border-color: transparent;
  }
  .sc-cell {
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.03);
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .sc-cell.has-note { background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.3); }
  .sc-cell.playing-1 { background: #f2f2f2; border-color: #ffffff; box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); }
  .sc-cell.playing-2 { background: #7d7d7d; border-color: #b5b5b5; box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }
  .sc-cell.played-1 { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.18); }
  .sc-cell.played-2 { background: rgba(140, 140, 140, 0.2); border-color: rgba(180, 180, 180, 0.25); }
  /* 垂直滚动模式:竖直判定线不再需要 */
  .sc-guide { display: none; }
  /* 截图对齐模式:琴键区域拉满,但滚动谱面始终保留在最底部 */
  body.has-align .keys { bottom: 0; }
  .sc-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- 换曲成功提示 ---------- */
  .toast {
    position: absolute;
    left: 50%; bottom: 12px;
    transform: translateX(-50%) translateY(8px);
    font-size: 11px;
    color: #eafff2;
    background: rgba(20, 60, 40, 0.92);
    border: 1px solid rgba(110, 240, 160, 0.5);
    border-radius: 8px;
    padding: 3px 12px;
    z-index: 60;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <div class="tb-row">
      <span class="grip">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <g fill="#9fb4d8"><rect x="0" y="0" width="4" height="4" rx="1"/><rect x="6" y="0" width="4" height="4" rx="1"/><rect x="0" y="6" width="4" height="4" rx="1"/><rect x="6" y="6" width="4" height="4" rx="1"/></g>
        </svg>
      </span>
      <span class="song-name" id="songName" title="">未知曲目</span>
      <button class="btn song" id="songBtn" title="从悬浮窗直接更换歌曲">♫</button>
      <button class="btn" id="startBtn" title="F11 开始/停止跟弹">开始</button>
      <button class="btn" id="captureBtn" title="F12 截图标记琴键位置,自动对齐">截图</button>
      <button class="btn adjust" id="adjustBtn" title="拖动琴键微调对齐">微调</button>
      <button class="btn" id="scrollBtn" title="进入谱面调整:拖动移动位置,滚轮调大小,Ctrl+滚轮或↑↓切排数">谱面</button>
      <button class="btn" id="hideBtn" title="F10 隐藏悬浮窗(再按 F10 显示)">隐藏</button>
      <button class="btn close" id="closeBtn" title="F9 关闭悬浮窗(再按 F9 打开)">×</button>
    </div>
    <div class="tb-row sub">
      <span class="grp">提前</span>
      <button class="btn mini" id="leadDown" title="提前量减">−</button>
      <span class="grp-val" id="leadVal">800ms</span>
      <button class="btn mini" id="leadUp" title="提前量加">＋</button>
      <span class="grp">倍速</span>
      <button class="btn mini" id="speedDown" title="倍速减">−</button>
      <span class="grp-val" id="speedVal">1.0x</span>
      <button class="btn mini" id="speedUp" title="倍速加">＋</button>
      <span class="grp">倒计时</span>
      <input class="cd-input" id="cdInput" type="number" min="0" max="60" step="0.5"
             title="开始跟弹前的倒计时(秒),0 表示立即开始" spellcheck="false" />
      <span class="grp-val">秒</span>
      <span class="status" id="status">待机</span>
      <span class="stats" id="stats"></span>
    </div>
  </div>
  <div class="progress"><div class="fill" id="progressFill"></div></div>
  <div class="song-panel" id="songPanel">
    <div class="sp-head">
      <span class="sp-title">更换歌曲</span>
      <input class="sp-search" id="songSearch" placeholder="搜索歌曲…" spellcheck="false" />
      <button class="sp-close sp-refresh" id="songRefresh" title="刷新列表">⟳</button>
      <button class="sp-close" id="songPanelClose" title="关闭">×</button>
    </div>
    <div class="song-list" id="songList"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="keys" id="keys"></div>
  <div class="scroller" id="scroller">
    <div class="sc-notes" id="scNotes"></div>
    <div class="sc-guide"></div>
    <div class="sc-hint" id="scHint">加载乐谱后显示滚动谱面</div>
  </div>
  <div class="adjust-hint">拖动琴键区微调对齐游戏按键;拖窗口边缘缩放、拖顶部移动窗口;完成后点「对齐」退出</div>
</div>

<script>
(function () {
  'use strict';

  const api = window.overlayAPI;
  const $ = (id) => document.getElementById(id);
  const keysEl = $('keys');

  let song = null;
  let speed = 1;

  // 琴键高亮模型:keyQueue[idx] = 该键上按时间排序的音符
  let keyQueue = [];   // Array(15) of [{ time, idx, hit, color }]
  let curPtr = [];     // Array(15) 当前处理到第几个
  let active = false;
  let startClock = 0;
  let timerId = 0;
  let stats = { ok: 0, bad: 0 };
  let endT = 0;        // 最后一个音符时刻

  // 开始前倒计时(毫秒,0=不倒计时立即开始)
  let countdownMs = 3000;
  let countdownTimer = 0;  // 倒计时定时器句柄
  let countdownUntil = 0;  // 倒计时结束时刻(performance.now 基准)

  let leadMs = 800;    // 提前量:音符时刻前多少毫秒开始高亮
  const JUDGE_WINDOW = 150; // 判定窗口 ±ms
  const MISS_WINDOW = 180;  // 超过此时长未按即 Miss
  const TOTAL = 15;
  const COLORS = 6;        // 相邻单音可用颜色数

  // 底部滚动谱面:3×5 网格块,每排 5 块,垂直滚动
  let scBlocks = [];         // [{ time, element, notes }]
  let scCurIdx = -1;         // 当前块索引

  // 截图对齐数据:{ keys: [{cx,cy,w,h} x15] } 相对窗口坐标(键中心+尺寸)
  let alignData = null;

  // 琴键区微调对齐状态(保存到 localStorage)
  let keysState = { offsetX: 0, offsetY: 0 };
  function loadKeysState() {
    try {
      const s = JSON.parse(localStorage.getItem('ov-keys'));
      if (s && typeof s === 'object') keysState = Object.assign(keysState, s);
    } catch (e) { /* 忽略 */ }
  }
  function saveKeysState() {
    try { localStorage.setItem('ov-keys', JSON.stringify(keysState)); } catch (e) { /* 忽略 */ }
  }
  function applyKeys() {
    keysEl.style.transform = 'translate(' + keysState.offsetX + 'px,' + keysState.offsetY + 'px)';
  }

  // 谱面位置调整状态(保存到 localStorage)
  let scrollPos = { offsetX: 0, offsetY: 0 };
  function loadScrollPos() {
    try {
      const s = JSON.parse(localStorage.getItem('ov-scroll'));
      if (s && typeof s === 'object') scrollPos = Object.assign(scrollPos, s);
    } catch (e) { /* 忽略 */ }
  }
  function saveScrollPos() {
    try { localStorage.setItem('ov-scroll', JSON.stringify(scrollPos)); } catch (e) { /* 忽略 */ }
  }
  function applyScrollPos() {
    const sc = $('scroller');
    if (sc) sc.style.transform = 'translate(' + scrollPos.offsetX + 'px,' + scrollPos.offsetY + 'px)';
  }
  let scrollAdjustMode = false;
  function setScrollAdjustMode(flag) {
    scrollAdjustMode = !!flag;
    document.body.classList.toggle('scroll-adjust', scrollAdjustMode);
    $('scrollBtn').classList.toggle('active', scrollAdjustMode);
    $('scrollBtn').textContent = scrollAdjustMode ? '完成' : '谱面';
    updateInteractive();
  }

  // 谱面大小缩放(0.5x - 2.5x,保存到 localStorage;调整模式下滚轮自由调节)
  let scrollScale = 1;
  const MIN_SCALE = 0.5, MAX_SCALE = 2.5, SCALE_STEP = 0.1;
  function loadScrollScale() {
    try {
      const v = parseFloat(localStorage.getItem('ov-scroll-scale'));
      if (!isNaN(v) && v >= MIN_SCALE && v <= MAX_SCALE) scrollScale = v;
    } catch (e) { /* 忽略 */ }
  }
  function saveScrollScale() {
    try { localStorage.setItem('ov-scroll-scale', String(scrollScale)); } catch (e) { /* 忽略 */ }
  }
  function applyScrollScale() {
    document.documentElement.style.setProperty('--scroll-scale', scrollScale.toFixed(3));
  }
  // 谱面排数(1-6 排,默认 4 排,保存到 localStorage;调整模式下 Ctrl+滚轮或 ↑↓ 调节)
  let scrollRows = 4;
  const MIN_ROWS = 1, MAX_ROWS = 6;
  function loadScrollRows() {
    try {
      const v = parseInt(localStorage.getItem('ov-scroll-rows'), 10);
      if (!isNaN(v) && v >= MIN_ROWS && v <= MAX_ROWS) scrollRows = v;
    } catch (e) { /* 忽略 */ }
  }
  function saveScrollRows() {
    try { localStorage.setItem('ov-scroll-rows', String(scrollRows)); } catch (e) { /* 忽略 */ }
  }
  function applyScrollRows() {
    document.documentElement.style.setProperty('--scroll-rows', String(scrollRows));
  }
  const scrollerEl = $('scroller');
  let scDrag = null;
  scrollerEl.addEventListener('pointerdown', (e) => {
    if (!scrollAdjustMode) return;
    if (e.button !== 0) return;
    scDrag = { startX: e.clientX, startY: e.clientY, ox: scrollPos.offsetX, oy: scrollPos.offsetY };
    try { scrollerEl.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    e.preventDefault();
  });
  scrollerEl.addEventListener('pointermove', (e) => {
    if (!scDrag) return;
    const dx = e.clientX - scDrag.startX;
    const dy = e.clientY - scDrag.startY;
    scrollPos.offsetX = clamp(scDrag.ox + dx, -200, 200);
    scrollPos.offsetY = clamp(scDrag.oy + dy, -200, 200);
    applyScrollPos();
  });
  const endScDrag = () => { if (scDrag) { scDrag = null; saveScrollPos(); } };
  scrollerEl.addEventListener('pointerup', endScDrag);
  scrollerEl.addEventListener('pointercancel', endScDrag);
  // 谱面调整模式下:滚轮自由调节大小;Ctrl+滚轮切换排数
  scrollerEl.addEventListener('wheel', (e) => {
    if (!scrollAdjustMode) return;
    e.preventDefault();
    if (e.ctrlKey) {
      scrollRows = clamp(scrollRows + (e.deltaY < 0 ? 1 : -1), MIN_ROWS, MAX_ROWS);
      applyScrollRows();
      saveScrollRows();
      if (scBlocks.length) updateScroll(currentTimeMs());
      showToast('谱面 ' + scrollRows + ' 排');
    } else {
      scrollScale = clamp(scrollScale + (e.deltaY < 0 ? SCALE_STEP : -SCALE_STEP), MIN_SCALE, MAX_SCALE);
      applyScrollScale();
      saveScrollScale();
      if (scBlocks.length) updateScroll(currentTimeMs());
      showToast('谱面 ' + Math.round(scrollScale * 100) + '%');
    }
  }, { passive: false });
  // 谱面调整模式下:↑↓ 键切换排数
  window.addEventListener('keydown', (e) => {
    if (!scrollAdjustMode) return;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      scrollRows = clamp(scrollRows + (e.key === 'ArrowUp' ? 1 : -1), MIN_ROWS, MAX_ROWS);
      applyScrollRows();
      saveScrollRows();
      if (scBlocks.length) updateScroll(currentTimeMs());
      showToast('谱面 ' + scrollRows + ' 排');
    }
  });

  // 倒计时时长配置(秒,保存到 localStorage)
  function loadCountdown() {
    try {
      const v = parseFloat(localStorage.getItem('ov-countdown'));
      if (!isNaN(v) && v >= 0 && v <= 60) countdownMs = Math.round(v * 1000);
    } catch (e) { /* 忽略 */ }
  }
  function saveCountdown() {
    try { localStorage.setItem('ov-countdown', String(countdownMs / 1000)); } catch (e) { /* 忽略 */ }
  }

  // ---------- 工具函数 ----------
  function keyToGridIndex(key) {
    const m = String(key).match(/^(\d)Key(\d+)$/);
    return m ? parseInt(m[2], 10) : -1;
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function setStatus(text, on) {
    const el = $('status');
    el.textContent = text;
    el.classList.toggle('on', !!on);
  }

  function updateStats() {
    $('stats').innerHTML =
      '<span class="ok">✓' + stats.ok + '</span> <span class="no">✗' + stats.bad + '</span>';
  }

  function keyEl(idx) {
    return document.getElementById('ovk-' + idx);
  }

  // ---------- 渲染琴键(3 行 5 列;有截图对齐数据时按绝对坐标定位) ----------
  function renderKeys() {
    keysEl.innerHTML = '';
    if (alignData && alignData.keys && alignData.keys.length === TOTAL) {
      keysEl.classList.add('aligned');
      document.body.classList.add('has-align');
      for (let i = 0; i < TOTAL; i++) {
        const k = alignData.keys[i];
        const key = document.createElement('div');
        key.className = 'key';
        key.id = 'ovk-' + i;
        key.style.left = (k.cx - k.w / 2) + 'px';
        key.style.top = (k.cy - k.h / 2) + 'px';
        key.style.width = Math.max(20, k.w) + 'px';
        key.style.height = Math.max(14, k.h) + 'px';
        key.style.fontSize = Math.max(10, Math.min(22, k.h * 0.34)) + 'px';
        keysEl.appendChild(key);
      }
    } else {
      keysEl.classList.remove('aligned');
      document.body.classList.remove('has-align');
      for (let row = 0; row < 3; row++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'key-row';
        for (let col = 0; col < 5; col++) {
          const idx = row * 5 + col;
          const key = document.createElement('div');
          key.className = 'key';
          key.id = 'ovk-' + idx;
          rowEl.appendChild(key);
        }
        keysEl.appendChild(rowEl);
      }
    }
    applyKeys();
  }

  // ---------- 滚动谱面(3×5 网格块,每排 5 块,垂直滚动) ----------
  const BLANK_STEP = 250;   // 每个空白块对应 250ms(空白停顿处按此粒度填充)
  // 生成一个空白块(无音符),返回元素
  function makeBlankBlock(t) {
    const bEl = document.createElement('div');
    bEl.className = 'sc-block blank';
    bEl.dataset.time = t;
    for (let j = 0; j < TOTAL; j++) {
      const cell = document.createElement('div');
      cell.className = 'sc-cell';
      bEl.appendChild(cell);
    }
    return bEl;
  }
  function buildScroll() {
    const box = $('scNotes');
    box.innerHTML = '';
    scBlocks = [];
    scCurIdx = -1;
    const hint = $('scHint');
    if (!song || !song.songNotes) {
      if (hint) hint.style.display = 'flex';
      // 无乐谱:生成空白骨架块并启用自动滚动,空白谱面也有滚动效果
      const blankCount = Math.max(scrollRows, 4) * 5;
      for (let i = 0; i < blankCount; i++) {
        const bEl = makeBlankBlock(i * BLANK_STEP);
        box.appendChild(bEl);
        scBlocks.push({ time: i * BLANK_STEP, element: bEl, notes: [], blank: true });
      }
      box.classList.add('preview');
      return;
    }
    if (hint) hint.style.display = 'none';
    box.classList.remove('preview');
    // 按时刻分组:同一时刻的所有音归入同一个块
    const noteMap = {};
    song.songNotes.forEach(n => {
      const idx = keyToGridIndex(n.key);
      if (idx < 0 || idx >= TOTAL) return;
      if (!noteMap[n.time]) noteMap[n.time] = [];
      noteMap[n.time].push({ idx: idx, register: n.key.startsWith('2') ? 2 : 1 });
    });
    const times = Object.keys(noteMap).map(Number).sort((a, b) => a - b);
    // 倒计时空白预滚块:在谱面最前面插入若干空白块(负时间),
    // 让倒计时期间谱面就开始正确滚动,倒计时结束第一个音符正好滚到判定线
    if (countdownMs > 0) {
      const blankCount = Math.min(Math.ceil(countdownMs / BLANK_STEP), 40);   // 上限 10 秒
      for (let i = 0; i < blankCount; i++) {
        const bt = -countdownMs + i * BLANK_STEP;
        const bEl = makeBlankBlock(bt);
        box.appendChild(bEl);
        scBlocks.push({ time: bt, element: bEl, notes: [], blank: true });
      }
    }
    // 遍历时刻,在相邻音符间空白停顿处(间隔超过一个粒度)插入空白块,
    // 让停顿的时长在谱面上正确体现
    let prevT = null;
    times.forEach(t => {
      if (prevT !== null) {
        const gap = t - prevT;
        const fill = Math.max(0, Math.floor(gap / BLANK_STEP) - 1);   // 中间的空白块数量
        for (let k = 1; k <= fill; k++) {
          const bt = prevT + k * BLANK_STEP;
          const bEl = makeBlankBlock(bt);
          box.appendChild(bEl);
          scBlocks.push({ time: bt, element: bEl, notes: [], blank: true });
        }
      }
      prevT = t;
      const block = document.createElement('div');
      block.className = 'sc-block';
      block.dataset.time = t;
      // 3 行 × 5 列 = 15 格,对应 15 个琴键(第 1/2/3 排)
      for (let i = 0; i < TOTAL; i++) {
        const cell = document.createElement('div');
        cell.className = 'sc-cell';
        const nd = noteMap[t].find(x => x.idx === i);
        if (nd) {
          cell.classList.add('has-note');
          cell.dataset.register = nd.register;
        }
        block.appendChild(cell);
      }
      box.appendChild(block);
      scBlocks.push({ time: t, element: block, notes: noteMap[t] });
    });
    updateScroll(0);
  }

  function updateScroll(t) {
    const grid = $('scNotes');
    const wrap = $('scroller');
    if (!grid || !wrap || scBlocks.length === 0) return;
    if (grid.classList.contains('preview')) return;  // 空白预览模式由 CSS 动画驱动,不在此定位
    // 当前块:最后一个 time <= t 的块
    let curIdx = -1;
    for (let i = 0; i < scBlocks.length; i++) {
      if (scBlocks[i].time <= t) curIdx = i; else break;
    }
    if (curIdx !== scCurIdx) {
      // 已弹过的块标记 played
      for (let i = 0; i < curIdx && i < scBlocks.length; i++) {
        const blk = scBlocks[i];
        blk.element.classList.remove('current-block');
        blk.element.querySelectorAll('.sc-cell.has-note').forEach(cell => {
          cell.classList.remove('playing-1', 'playing-2', 'played-1', 'played-2');
          cell.classList.add('played-' + (cell.dataset.register || '1'));
        });
      }
      // 当前块高亮(空白块也用淡高亮,保证滚动效果连贯),后续块恢复未弹状态
      scBlocks.forEach((b, i) => {
        b.element.classList.toggle('current-block', i === curIdx);
        if (i === curIdx) {
          b.element.querySelectorAll('.sc-cell.has-note').forEach(cell => {
            cell.classList.remove('played-1', 'played-2', 'playing-1', 'playing-2');
            cell.classList.add('playing-' + (cell.dataset.register || '1'));
          });
        } else if (i > curIdx) {
          b.element.querySelectorAll('.sc-cell.playing-1, .sc-cell.playing-2, .sc-cell.played-1, .sc-cell.played-2').forEach(cell => {
            cell.classList.remove('playing-1', 'playing-2', 'played-1', 'played-2');
          });
        }
      });
      scCurIdx = curIdx;
    }
    // 垂直滚动:当前块所在行滚到可见区中间(4 排可见,每排 5 块,往下排走)
    if (curIdx >= 0 && scBlocks[curIdx]) {
      const blockEl = scBlocks[curIdx].element;
      const wrapH = wrap.clientHeight;
      const centerOffset = wrapH / 2;
      const blockCenter = blockEl.offsetTop + blockEl.offsetHeight / 2;
      const targetY = centerOffset - blockCenter;
      const maxScroll = Math.max(0, grid.scrollHeight - wrapH);
      grid.style.transform = 'translateY(' + clamp(targetY, -maxScroll, 0) + 'px)';
    } else {
      grid.style.transform = 'translateY(0)';
    }
  }

  // ---------- 构建高亮序列(按时间分组,相邻组颜色不同,同组同色) ----------
  function buildQueue(s) {
    if (!s || !s.songNotes) return [];
    // 按时间分组,分配颜色:相邻时间组颜色不同,同时间(和弦)同色
    const timeMap = new Map();
    s.songNotes.forEach(n => {
      const idx = keyToGridIndex(n.key);
      if (idx < 0 || idx >= TOTAL) return;
      if (!timeMap.has(n.time)) timeMap.set(n.time, []);
      timeMap.get(n.time).push(idx);
    });
    const times = Array.from(timeMap.keys()).sort((a, b) => a - b);
    let lastColor = -1;
    const colorOf = new Map(); // time -> color
    times.forEach(t => {
      const color = (lastColor + 1) % COLORS;
      colorOf.set(t, color);
      lastColor = color;
    });

    const groups = Array.from({ length: TOTAL }, () => []);
    s.songNotes.forEach(n => {
      const idx = keyToGridIndex(n.key);
      if (idx < 0 || idx >= TOTAL) return;
      groups[idx].push({ time: n.time, idx: idx, hit: false, color: colorOf.get(n.time) });
    });
    groups.forEach(g => g.sort((a, b) => a.time - b.time));
    return groups;
  }

  function setPendingColor(el, color) {
    if (!el) return;
    for (let c = 0; c < COLORS; c++) el.classList.remove('pending-' + c);
    el.classList.add('pending-' + (color % COLORS));
  }
  function clearPendingColor(el) {
    if (!el) return;
    for (let c = 0; c < COLORS; c++) el.classList.remove('pending-' + c);
  }

  // 下一个音符提示:键上角标显示剩余毫秒(ms 为 null 时隐藏)
  function setNextBadge(el, ms) {
    if (!el) return;
    let b = el.querySelector('.next-badge');
    if (!b) {
      b = document.createElement('span');
      b.className = 'next-badge';
      el.appendChild(b);
    }
    if (ms == null) {
      b.style.display = 'none';
    } else {
      b.textContent = String(Math.max(0, Math.ceil(ms)));
      b.style.display = 'flex';
    }
  }
  function clearNext(el) {
    if (!el) return;
    el.classList.remove('next');
    setNextBadge(el, null);
  }

  // ---------- 高亮动画 ----------
  function currentTimeMs() {
    return (performance.now() - startClock) * speed;
  }

  function tick(now) {
    if (!active) return;
    const t = currentTimeMs();
    // 第一遍:找出所有待弹音符中时间最近的时刻 nextTime(和弦=同时刻整组)
    let nextTime = Infinity;
    for (let idx = 0; idx < TOTAL; idx++) {
      const n = keyQueue[idx][curPtr[idx]];
      if (!n || n.hit) continue;
      const d = t - n.time;
      if (d >= -leadMs && d <= MISS_WINDOW && n.time < nextTime) nextTime = n.time;
    }
    // 第二遍:渲染每个键的预备/下一个状态
    for (let idx = 0; idx < TOTAL; idx++) {
      const q = keyQueue[idx];
      const n = q[curPtr[idx]];
      const el = keyEl(idx);
      if (!n) {                      // 该键没有待弹音符
        if (el) { el.classList.remove('pending'); clearPendingColor(el); clearNext(el); }
        continue;
      }
      const d = t - n.time;
      if (d < -leadMs) {             // 未到提前量,不亮
        el.classList.remove('pending');
        clearPendingColor(el);
        clearNext(el);
      } else if (d <= MISS_WINDOW) { // 提前期 + 到时刻后判定窗口内:持续高亮等待按键
        el.classList.add('pending');
        setPendingColor(el, n.color);
        const isNext = (Math.abs(n.time - nextTime) < 0.5);
        el.classList.toggle('next', isNext);
        if (isNext) setNextBadge(el, -d);   // 剩余毫秒倒计时
        else setNextBadge(el, null);
      } else {                       // 超时未按 → Miss
        missKey(idx, el, n);
      }
    }
    const pct = endT ? Math.max(0, Math.min(100, Math.round(t / endT * 100))) : 0;
    $('progressFill').style.width = pct + '%';
    updateScroll(t);
  }

  // ---------- 判定 ----------
  function hitKey(idx, el) {
    stats.ok++;
    el.classList.remove('pending', 'wrong', 'miss');
    clearPendingColor(el);
    clearNext(el);
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 300);
    updateStats();
  }

  function missKey(idx, el, n) {
    n.hit = true;
    curPtr[idx]++;
    stats.bad++;
    el.classList.remove('pending');
    clearPendingColor(el);
    clearNext(el);
    el.classList.add('miss');
    setTimeout(() => el.classList.remove('miss'), 400);
    updateStats();
  }

  function wrongKey(idx, el) {
    stats.bad++;
    el.classList.remove('pending', 'hit', 'miss');
    clearPendingColor(el);
    clearNext(el);
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 260);
    updateStats();
  }

  function handleKey(idx) {
    if (!active) return;
    if (idx < 0 || idx >= TOTAL) return;
    const t = currentTimeMs();
    const q = keyQueue[idx];
    const n = q[curPtr[idx]];
    const el = keyEl(idx);
    if (n && !n.hit && Math.abs(t - n.time) <= JUDGE_WINDOW) {
      n.hit = true;
      curPtr[idx]++;
      hitKey(idx, el);
    } else {
      wrongKey(idx, el);
    }
  }

  // ---------- 开始 / 停止 ----------
  // 校验乐谱后真正开始跟弹
  function doStart() {
    curPtr = keyQueue.map(() => 0);
    endT = 0;
    keyQueue.forEach(q => { if (q.length) endT = Math.max(endT, q[q.length - 1].time); });
    stats = { ok: 0, bad: 0 };
    active = true;
    // 倒计时开始的话 startClock 已在 beginCountdown 设为倒计时结束时刻(时间轴无缝衔接);
    // 直接开始(无倒计时)时 startClock 为 0,才从现在起算
    if (!startClock) startClock = performance.now();
    if (timerId) clearInterval(timerId);
    for (let i = 0; i < TOTAL; i++) {
      const el = keyEl(i);
      el.classList.remove('pending', 'hit', 'wrong', 'miss');
      clearPendingColor(el);
      clearNext(el);
    }
    $('startBtn').textContent = '停止';
    $('startBtn').classList.add('stop');
    $('startBtn').title = 'F11 开始/停止跟弹';
    setStatus('跟弹中', true);
    updateStats();
    $('progressFill').style.width = '0%';
    timerId = setInterval(tick, 16);
  }

  // 点击开始:先进行用户设定的倒计时,倒计时结束才真正开始
  function beginCountdown() {
    if (!song || !song.songNotes) { setStatus('无乐谱'); return; }
    keyQueue = buildQueue(song);
    if (keyQueue.every(q => q.length === 0)) { setStatus('无有效音符'); return; }
    if (countdownMs <= 0) { doStart(); return; }
    countdownUntil = performance.now() + countdownMs;
    // 把时钟基准设为倒计时结束时刻:倒计时期间 tick 就按提前量亮起第一个音并滚动谱面,
    // 倒计时一结束第一个音正好到达判定线,速度快也不至于来不及反应
    startClock = countdownUntil;
    active = true;
    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 16);
    $('startBtn').classList.add('stop');
    $('startBtn').title = '倒计时中,点击取消';
    countdownTimer = setInterval(() => {
      const left = countdownUntil - performance.now();
      if (left <= 0) {
        clearInterval(countdownTimer);
        countdownTimer = 0;
        doStart();
        return;
      }
      const secs = Math.ceil(left / 1000);
      $('startBtn').textContent = String(secs);
      setStatus('倒计时 ' + secs + ' 秒', true);
    }, 100);
    const totalSecs = Math.ceil(countdownMs / 1000);
    $('startBtn').textContent = String(totalSecs);
    setStatus('倒计时 ' + totalSecs + ' 秒', true);
  }

  function stop() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = 0; }
    active = false;
    if (timerId) clearInterval(timerId);
    startClock = 0;
    for (let i = 0; i < TOTAL; i++) {
      const el = keyEl(i);
      el.classList.remove('pending', 'hit', 'wrong', 'miss');
      clearPendingColor(el);
      clearNext(el);
    }
    keyQueue = [];
    curPtr = [];
    $('startBtn').textContent = '开始';
    $('startBtn').classList.remove('stop');
    $('startBtn').title = 'F11 开始/停止跟弹';
    setStatus('已停止');
    updateStats();
    updateScroll(0);
  }

  // ---------- 调整模式(拖动琴键区微调对齐游戏按键) ----------
  let adjustMode = false;
  function setAdjustMode(flag) {
    adjustMode = !!flag;
    document.body.classList.toggle('adjust', adjustMode);
    $('adjustBtn').classList.toggle('active', adjustMode);
    $('adjustBtn').textContent = adjustMode ? '完成' : '对齐';
    api.setAdjustMode(adjustMode);
    if (!adjustMode) updateInteractive();
  }

  let drag = null;
  keysEl.addEventListener('pointerdown', (e) => {
    if (!adjustMode) return;
    if (e.button !== 0) return;
    drag = { startX: e.clientX, startY: e.clientY, ox: keysState.offsetX, oy: keysState.offsetY };
    try { keysEl.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    e.preventDefault();
  });
  keysEl.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    const w = keysEl.clientWidth;
    const h = keysEl.clientHeight;
    keysState.offsetX = clamp(drag.ox + dx, -(w * 0.3), w * 0.3);
    keysState.offsetY = clamp(drag.oy + dy, -(h * 0.4), h * 0.4);
    applyKeys();
  });
  const endDrag = () => { if (drag) { drag = null; saveKeysState(); } };
  keysEl.addEventListener('pointerup', endDrag);
  keysEl.addEventListener('pointercancel', endDrag);

  // 鼠标穿透控制:标题栏可点击由主进程按鼠标位置自动判断;
  // 渲染层仅在上报"整窗可交互"状态(换曲面板打开/调整模式)时通知主进程
  let songPanelOpen = false;
  function updateInteractive() {
    api.setInteractive(adjustMode || songPanelOpen || scrollAdjustMode);
  }

  // ---------- 事件绑定 ----------
  $('startBtn').addEventListener('click', () => {
    if (active) stop();
    else if (countdownTimer) stop();  // 倒计时中点击=取消
    else beginCountdown();
  });
  $('closeBtn').addEventListener('click', () => api.close());
  $('hideBtn').addEventListener('click', () => {
    stop();
    api.hide();
  });
  $('adjustBtn').addEventListener('click', () => setAdjustMode(!adjustMode));
  $('scrollBtn').addEventListener('click', () => setScrollAdjustMode(!scrollAdjustMode));
  $('captureBtn').addEventListener('click', () => {
    // 截图对齐前退出微调/谱面调整模式,避免鼠标穿透干扰
    if (adjustMode) setAdjustMode(false);
    if (scrollAdjustMode) setScrollAdjustMode(false);
    api.capture();
  });

  // ---------- 换曲面板(从悬浮窗直接更换歌曲) ----------
  const songPanel = $('songPanel');
  const songList = $('songList');
  let songCache = [];  // 当前完整曲目列表

  function closeSongPanel() {
    songPanelOpen = false;
    songPanel.classList.remove('show');
    $('songBtn').classList.remove('active');
    updateInteractive();
  }

  async function openSongPanel() {
    if (songPanelOpen) { closeSongPanel(); return; }
    songPanelOpen = true;
    songPanel.classList.add('show');
    $('songBtn').classList.add('active');
    api.setInteractive(true);
    if (!songCache.length) {
      songList.innerHTML = '<div class="song-loading">加载曲目…</div>';
      try {
        const res = await api.listSongs();
        songCache = (res && res.songs) || [];
      } catch (e) {
        songCache = [];
      }
    }
    $('songSearch').value = '';
    renderSongList();
  }

  function renderSongList() {
    const kw = ($('songSearch').value || '').trim().toLowerCase();
    const filtered = kw
      ? songCache.filter(s =>
          (s.name || '').toLowerCase().includes(kw) || (s.author || '').toLowerCase().includes(kw))
      : songCache;
    if (!filtered.length) {
      songList.innerHTML = '<div class="song-loading">' + (kw ? '没有匹配的歌曲' : '没有可选的歌曲(可先到主窗口加载或收藏乐谱)') + '</div>';
      return;
    }
    const curName = (song && song.name) || '';
    songList.innerHTML = '';
    filtered.forEach((s) => {
      const isCur = s.name === curName;
      const row = document.createElement('div');
      row.className = 'song-item' + (isCur ? ' current' : '');
      const tag = document.createElement('span');
      tag.className = 'song-tag' + (s.source === 'cloud' ? ' cloud' : '');
      tag.textContent = isCur ? '当前' : (s.source === 'cloud' ? '云' : '库');
      const nameEl = document.createElement('span');
      nameEl.className = 'song-name2';
      nameEl.textContent = s.name;
      const authorEl = document.createElement('span');
      authorEl.className = 'song-author';
      authorEl.textContent = s.author || '';
      row.appendChild(tag);
      row.appendChild(nameEl);
      row.appendChild(authorEl);
      row.title = s.name + (s.author ? ' · ' + s.author : '');
      row.addEventListener('click', async () => {
        row.classList.add('err');
        try {
          const res = await api.selectSong(s.id);
          if (res && res.ok) {
            // 主进程已推送新乐谱到本窗;不自动开始,由用户按 F11 或点「开始」
            closeSongPanel();
            showToast('已切换到《' + s.name + '》');
          } else {
            row.classList.remove('err');
            row.textContent = (res && res.error) || '切换失败';
          }
        } catch (e) {
          row.classList.remove('err');
          row.textContent = '切换失败';
        }
      });
      songList.appendChild(row);
    });
  }

  $('songBtn').addEventListener('click', openSongPanel);
  $('songPanelClose').addEventListener('click', closeSongPanel);
  $('songRefresh').addEventListener('click', async () => {
    songCache = [];
    songList.innerHTML = '<div class="song-loading">加载曲目…</div>';
    try {
      const res = await api.listSongs();
      songCache = (res && res.songs) || [];
    } catch (e) {
      songCache = [];
    }
    renderSongList();
  });
  $('songSearch').addEventListener('input', renderSongList);
  // 点击面板外区域关闭换曲面板
  document.addEventListener('pointerdown', (e) => {
    if (songPanelOpen && !songPanel.contains(e.target) && e.target !== $('songBtn')) {
      closeSongPanel();
    }
  });

  // 主进程快捷键命令
  api.onCommand((cmd) => {
    if (cmd === 'toggle-play') {
      if (active) stop();
      else if (countdownTimer) stop();  // 倒计时中再按=取消
      else beginCountdown();
    } else if (cmd === 'stop') {
      stop();
    }
  });

  $('leadDown').addEventListener('click', () => { leadMs = Math.max(400, leadMs - 100); renderLead(); });
  $('leadUp').addEventListener('click', () => { leadMs = Math.min(1500, leadMs + 100); renderLead(); });
  function renderLead() { $('leadVal').textContent = leadMs + 'ms'; }

  // ---------- 倍速控制(0.5x - 2.0x,步进 0.25;与主窗口播放器速度档一致) ----------
  $('speedDown').addEventListener('click', () => setSpeed(speed - 0.25));
  $('speedUp').addEventListener('click', () => setSpeed(speed + 0.25));
  function renderSpeed() {
    $('speedVal').textContent = speed.toFixed(2).replace(/\.?0+$/, '') + 'x';
  }
  function setSpeed(v) {
    // 改变倍速时保持当前进度不跳变:重算基准时钟
    const t = currentTimeMs();
    speed = clamp(v, 0.5, 2);
    startClock = performance.now() - t / speed;
    renderSpeed();
    api.setSpeed(speed);
  }

  // ---------- 倒计时时长设置(秒,0=立即开始) ----------
  loadCountdown();
  const cdInput = $('cdInput');
  cdInput.value = (countdownMs / 1000).toFixed(countdownMs % 1000 ? 1 : 0);
  cdInput.addEventListener('change', () => {
    let v = parseFloat(cdInput.value);
    if (isNaN(v) || v < 0) v = 0;
    if (v > 60) v = 60;
    v = Math.round(v * 10) / 10;  // 支持 0.5 秒粒度
    countdownMs = Math.round(v * 1000);
    cdInput.value = v.toFixed(v % 1 ? 1 : 0);
    saveCountdown();
    // 空白预滚块数量跟随倒计时时长,重新生成谱面
    buildScroll();
    showToast('倒计时设为 ' + cdInput.value + ' 秒');
  });

  // ---------- 提示条(换曲成功等) ----------
  let toastTimer = 0;
  function showToast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ---------- 主进程消息 ----------
  api.onData((payload) => {
    if (!payload) return;
    song = payload;
    speed = (payload.speed && payload.speed > 0) ? payload.speed : 1;
    renderSpeed();
    $('songName').textContent = payload.name || '未知曲目';
    $('songName').title = (payload.name || '') + ((payload.author) ? ' · ' + payload.author : '');
    renderKeys();
    stop();
    buildScroll();
  });

  api.onKey((idx) => handleKey(idx));

  api.onAdjustMode((flag) => {
    if (flag !== adjustMode) setAdjustMode(flag);
  });

  api.onAlignKeys((payload) => {
    if (!payload || !payload.keys || payload.keys.length !== TOTAL) return;
    alignData = payload;
    keysState = { offsetX: 0, offsetY: 0 };
    applyKeys();
    renderKeys();
  });

  // 初始渲染
  loadKeysState();
  loadScrollPos();
  applyScrollPos();
  loadScrollScale();
  applyScrollScale();
  loadScrollRows();
  applyScrollRows();
  renderKeys();
  buildScroll();
  renderLead();
  renderSpeed();
  // 窗口缩放时重新计算谱面行列定位
  window.addEventListener('resize', () => {
    if (scBlocks.length) updateScroll(currentTimeMs());
  });
})();
</script>
</body>
</html>
